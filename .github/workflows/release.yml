name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  create-release:
    name: Build and create tagged release
    runs-on: ubuntu-latest

    steps:
      - name: Install archive tools
        run: sudo apt-get update && sudo apt-get install -y zip unzip

      - name: Checkout tagged source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install and verify web UI
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run check

      - name: Determine release type
        id: release
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set manifest version for artifact
        run: bun .github/actions/bump-manifest-version.js
        env:
          TGT_RELEASE_VERSION: ${{ github.ref_name }}

      - name: Build and validate release archive
        shell: bash
        run: |
          set -euo pipefail

          release_root="./temp/mbt_meta_clothes"
          rm -rf ./temp ./mbt_meta_clothes.zip
          mkdir -p "${release_root}/web"

          cp ./README.md ./LICENSE.md ./config.lua ./fxmanifest.lua "${release_root}/"
          cp -r ./core ./data ./item_image ./locales ./modules "${release_root}/"
          # Only the installation guide: docs/superpowers holds internal plans and specs.
          mkdir -p "${release_root}/docs"
          cp ./docs/installation.md "${release_root}/docs/"
          cp -r ./web/dist "${release_root}/web/"

          # tests/ is a development instrument and ships nowhere. Its manifest
          # entries have to go with it: leaving them behind makes the resource
          # log a missing-file warning for every spec on boot. Stripped from the
          # copy, so the repo keeps its self-tests intact.
          sed -i -e "/tests\/.*_spec\.lua/d" \
                 -e "/Deterministic server-console self-tests/d" \
                 "${release_root}/fxmanifest.lua"
          if grep -q "_spec\.lua" "${release_root}/fxmanifest.lua"; then
            echo "release manifest still references a spec file" >&2
            exit 1
          fi

          bun .github/actions/validate-release.mjs \
            "${release_root}" "${GITHUB_REF_NAME#v}"

          # --- MBT.Debug gate -------------------------------------------------
          # The PACKAGED default is fail-closed, whatever the development
          # config.lua says. Keeping MBT.Debug = true while working is correct
          # and intended: the tests need it. What must not be possible is for it
          # to reach a release, and until now that depended on someone
          # remembering before the tag. It has escaped three times since 2022,
          # once because a `git add -A` put it back to true.
          #
          # If the marker is absent the build FAILS: better not to release than
          # to release an unknown default. Same contract as
          # mbt_hud/scripts/build-release.mjs, the model for the catalogue.
          CFG="${release_root}/config.lua"
          if grep -qE '^[[:space:]]*MBT\.Debug[[:space:]]*=[[:space:]]*true' "$CFG"; then
            sed -i -E 's/^([[:space:]]*MBT\.Debug[[:space:]]*=[[:space:]]*)true/\1false/' "$CFG"
            echo "gate: MBT.Debug was true, rewritten to false in the package"
          elif ! grep -qE '^[[:space:]]*MBT\.Debug[[:space:]]*=[[:space:]]*false' "$CFG"; then
            echo "::error::config.lua: MBT.Debug release default not found"
            exit 1
          fi
          grep -E '^[[:space:]]*MBT\.Debug' "$CFG"
          # --------------------------------------------------------------------
          cd ./temp
          zip -r -q ../mbt_meta_clothes.zip ./mbt_meta_clothes
          cd ..
          unzip -t ./mbt_meta_clothes.zip

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: mbt_meta_clothes.zip
          name: ${{ github.ref_name }}
          prerelease: ${{ steps.release.outputs.prerelease }}
          fail_on_unmatched_files: true
