name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  create-release:
    name: Build and create tagged release
    runs-on: ubuntu-latest

    steps:
      - name: Install archive tools
        run: sudo apt-get update && sudo apt-get install -y zip unzip

      - name: Checkout tagged source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install and verify web UI
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run check

      - name: Determine release type
        id: release
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set manifest version for artifact
        run: bun .github/actions/bump-manifest-version.js
        env:
          TGT_RELEASE_VERSION: ${{ github.ref_name }}

      - name: Build and validate release archive
        shell: bash
        run: |
          set -euo pipefail

          release_root="./temp/mbt_meta_clothes"
          rm -rf ./temp ./mbt_meta_clothes.zip
          mkdir -p "${release_root}/web"

          cp ./README.md ./config.lua ./fxmanifest.lua "${release_root}/"
          cp -r ./core ./data ./item_image ./locales ./modules ./tests "${release_root}/"
          cp -r ./web/dist "${release_root}/web/"

          bun .github/actions/validate-release.mjs \
            "${release_root}" "${GITHUB_REF_NAME#v}"

          cd ./temp
          zip -r -q ../mbt_meta_clothes.zip ./mbt_meta_clothes
          cd ..
          unzip -t ./mbt_meta_clothes.zip

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: mbt_meta_clothes.zip
          name: ${{ github.ref_name }}
          prerelease: ${{ steps.release.outputs.prerelease }}
          fail_on_unmatched_files: true
